<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>FacturaPro 360 - Sistema de Gestión y Facturación</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="FacturaPro 360: Facturación, clientes, inventario kardex y finanzas" />
    <meta name="theme-color" content="#0B192C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FacturaPro 360" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FacturaPro 360" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/images/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  </head>
  <body class="bg-[#060E1A] text-slate-100 font-sans antialiased selection:bg-brand-600 selection:text-white">
    <app-root></app-root>
    <script>
      // Limpiar service workers antiguos y cachés desactualizados
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) {
            r.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            caches.delete(name);
          }
        });
      }
      // Detección y auto-recuperación si el navegador intenta cargar chunks JS antiguos
      window.addEventListener('error', function(e) {
        var msg = (e.message || '').toLowerCase();
        var target = e.target;
        var isScriptTag = target && target.tagName === 'SCRIPT';
        if (msg.includes('mime type') || msg.includes('failed to load module') || isScriptTag) {
          var key = 'facturapro_reload_retry';
          var last = sessionStorage.getItem(key);
          if (!last || (Date.now() - parseInt(last, 10)) > 8000) {
            sessionStorage.setItem(key, Date.now().toString());
            window.location.reload();
          }
        }
      }, true);
    </script>
  </body>
</html>
