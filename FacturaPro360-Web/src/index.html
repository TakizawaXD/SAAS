<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>FacturaPro 360 - Sistema de Gestión y Facturación</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="FacturaPro 360: Facturación, clientes, inventario kardex y finanzas" />
    <meta name="theme-color" content="#0B192C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FacturaPro 360" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FacturaPro 360" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/images/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Silenciar advertencia de Tailwind CDN en consola de producción
      (function() {
        const _warn = console.warn;
        console.warn = function(...args) {
          if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
          _warn.apply(console, args);
        };
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
            colors: {
              navy: {
                950: '#060E1A',
                900: '#0B192C',
                850: '#10223B',
                800: '#152C4C',
                700: '#1E3E66'
              },
              brand: {
                50: '#EFF6FF',
                100: '#DBEAFE',
                500: '#3B82F6',
                600: '#2563EB',
                700: '#1D4ED8'
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#060E1A] text-slate-100 font-sans antialiased selection:bg-brand-600 selection:text-white">
    <app-root></app-root>
    <script>
      // Limpiar service workers antiguos y cachés desactualizados
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) {
            r.unregister();
          }
        });
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var name of names) {
              caches.delete(name);
            }
          });
        }
      }
    </script>
  </body>
</html>
