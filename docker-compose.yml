services:
  # SERVICIO WEB: FacturaPro 360 Frontend Angular Nginx
  facturapro-web:
    build:
      context: ./FacturaPro360-Web
      dockerfile: Dockerfile
    container_name: facturapro-web
    restart: unless-stopped
    ports:
      - "8080:80"
      - "80:80"
    environment:
      - NODE_ENV=production
    depends_on:
      facturapro-db:
        condition: service_healthy
    networks:
      - facturapro-network

  # SERVICIO BASE DE DATOS: PostgreSQL 15 con Esquema, RLS y Migraciones pre-cargadas
  facturapro-db:
    image: postgres:15-alpine
    container_name: facturapro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ./FacturaPro360-Web/supabase/migrations:/docker-entrypoint-initdb.d:ro
      - facturapro_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - facturapro-network

networks:
  facturapro-network:
    driver: bridge

volumes:
  facturapro_pg_data:
    driver: local
